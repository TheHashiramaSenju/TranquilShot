# sim_config.yaml â€” TranquilShot Simulation Parameters
# FIX: Removed hardcoded absolute path (/media/notshadow/d5dd988b-...)
#      that crashed on any machine other than the original developer's.
#      model_path is now empty by default and can be overridden via:
#      ros2 launch tranq_bringup sim.launch.py model_path:=/path/to/best.pt

use_sim_time: true

detector_node:
  ros__parameters:
    # Set via CLI: ros2 launch tranq_bringup sim.launch.py model_path:=<path>
    # Default searches relative to package share (set in sim.launch.py)
    model_path: ""
    backend: "pytorch"
    device: "cuda"        # Automatically falls back to CPU if no GPU
    confidence_threshold: 0.45
    nms_threshold: 0.5
    image_topic: "/camera/image_raw"
    detection_topic: "/detection"
    visualize: true
    classes:
      - "elephant"
      - "rhino"
      - "lion"
      - "buffalo"

controller_node:
  ros__parameters:
    kp_yaw: 0.005
    ki_yaw: 0.0001
    kd_yaw: 0.001
    kp_pitch: 0.005
    ki_pitch: 0.0001
    kd_pitch: 0.001
    dead_band_px: 5.0
    frame_width: 640
    frame_height: 480
    output_clamp: 0.4
    max_linear_speed: 2.0
    hover_altitude: 8.0

fusion_node:
  ros__parameters:
    kalman_process_noise: 0.1
    kalman_measurement_noise: 1.0
    max_occlusion_frames: 30
    focal_length_px: 554.26
    sensor_height_m: 0.0024
    image_height_px: 480

actuator_node:
  ros__parameters:
    safe_fire_range_min_m: 3.0
    safe_fire_range_max_m: 40.0
    dart_muzzle_velocity_ms: 45.0
    dart_mass_g: 2.5
    dart_drag_coefficient: 0.47
    confirmation_timeout_s: 2.0
    dual_confirm_required: true
